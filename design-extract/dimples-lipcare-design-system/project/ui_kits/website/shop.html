<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Dimples Lipcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/logo-monogram.svg">
  <link rel="stylesheet" href="website.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="SiteOrnaments.jsx"></script>
  <script type="text/babel" src="ProductBottle.jsx"></script>
  <script type="text/babel" src="SiteHeader.jsx"></script>
  <script type="text/babel" src="SiteFooter.jsx"></script>
  <script type="text/babel" src="ShopCatalog.jsx"></script>

  <script type="text/babel">
    function ShopPage() {
      const [bag, setBag] = React.useState(0);
      const [toast, setToast] = React.useState(null);

      const handleAdd = (name) => {
        setBag(b => b + 1);
        setToast(`${name} added to your bag`);
        setTimeout(() => setToast(null), 2400);
      };

      return (
        <div className="site" data-screen-label="03 Shop">
          <SiteHeader bagCount={bag} active="shop" />
          <ShopHero />
          <ShopCatalog onAdd={handleAdd} />
          <SiteFooter />

          <div className={`toast ${toast ? "show" : ""}`}>
            <img className="heart" src="../../assets/motif-heart.svg" alt=""/>
            <span>{toast || ""}</span>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<ShopPage />);
  </script>
</body>
</html>
