<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--pearl);
    border-radius: 999px;
    padding: 10px 18px 10px 12px;
    box-shadow: var(--shadow-2);
    border: 1px solid var(--line-soft);
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--ink);
  }
  .pill .ico {
    width: 32px; height: 32px; border-radius: 999px;
    background: var(--grad-deep); color: #fff8f4;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .pill .lbl { font-family: var(--font-sans); font-weight: 500; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--fg-3); }
  .pill .val { font-family: var(--font-serif); font-style: italic; font-size: 18px; color: var(--ink); }
  .pill.rose .ico { background: var(--grad-rosegold); color: var(--blush-900); }
  .pill.deep { background: var(--grad-deep); color: #fff8f4; border: 0; }
  .pill.deep .lbl { color: rgba(255,248,244,.7); }
  .pill.deep .val { color: #fff8f4; }
  .pill.deep .ico { background: rgba(255,255,255,.18); color: #fff8f4; }
</style>
</head>
<body>
<div class="card">
  <div style="display:flex; flex-wrap:wrap; gap: 14px;">
    <span class="pill">
      <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
      <span><span class="lbl">Call</span><br><span class="val">0903 879 6354</span></span>
    </span>
    <span class="pill">
      <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
      <span><span class="lbl">Call</span><br><span class="val">0902 533 3560</span></span>
    </span>
    <span class="pill rose">
      <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1" fill="currentColor"/></svg></span>
      <span><span class="lbl">Instagram</span><br><span class="val">@Dimples_lipcare</span></span>
    </span>
    <span class="pill deep">
      <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 7.5a6.5 6.5 0 0 1-4-1.4v8.7a6 6 0 1 1-6-6c.3 0 .6 0 1 .1V12a3 3 0 1 0 2 2.8V2h3a4.5 4.5 0 0 0 4 4.5v1z"/></svg></span>
      <span><span class="lbl">TikTok</span><br><span class="val">@Dimples_lipcare</span></span>
    </span>
  </div>
  <div class="row" style="justify-content:space-between; margin-top:14px;">
    <span class="label">Contact pills · phone, social, deep variant</span>
    <span class="mono">--r-pill · --grad-deep · --grad-rosegold</span>
  </div>
</div>
</body></html>
