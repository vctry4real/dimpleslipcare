<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .tile { aspect-ratio: 1 / 1; background: var(--grad-petal); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; box-shadow: var(--shadow-2); }
  .tile .nm { font-family: var(--font-serif); font-style: italic; font-size: 16px; color: var(--ink); }
  .tile .mono { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--ink); opacity: .6; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="tile" style="border-radius: 6px;"><div class="nm">xs</div><div class="mono">6</div></div>
    <div class="tile" style="border-radius: 10px;"><div class="nm">sm</div><div class="mono">10</div></div>
    <div class="tile" style="border-radius: 16px;"><div class="nm">md</div><div class="mono">16</div></div>
    <div class="tile" style="border-radius: 24px;"><div class="nm">lg</div><div class="mono">24</div></div>
    <div class="tile" style="border-radius: 32px;"><div class="nm">xl</div><div class="mono">32</div></div>
    <div class="tile" style="border-radius: 999px;"><div class="nm">pill</div><div class="mono">∞</div></div>
  </div>
  <div class="row" style="justify-content:space-between; margin-top: 14px;">
    <span class="label">Radii · always rounded · pill for buttons</span>
    <span class="mono">--r-xs → --r-pill</span>
  </div>
</div>
</body></html>
