<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .product {
    position: relative;
    background: var(--pearl);
    border-radius: var(--r-xl);
    padding: 16px;
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }
  .product::after {
    content: ""; position: absolute; inset: 0;
    background: var(--grad-sheen);
    pointer-events: none;
  }
  .product .photo {
    position: relative; z-index: 1;
    background: var(--grad-petal);
    border-radius: var(--r-lg);
    aspect-ratio: 4 / 3;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .product .photo .sheen { position:absolute; inset: 0; background: var(--grad-sheen); }
  /* CSS lip gloss bottle */
  .gloss-bottle {
    position: relative;
    width: 60px; height: 130px;
    filter: drop-shadow(0 6px 12px rgba(140,45,74,.25));
  }
  .gloss-bottle .cap { position:absolute; top:0; left:50%; transform: translateX(-50%); width: 38px; height: 26px; background: linear-gradient(180deg, #f5e9dc, #d9a98c); border-radius: 6px 6px 4px 4px; box-shadow: inset 0 -3px 6px rgba(0,0,0,.1), inset 0 2px 3px rgba(255,255,255,.6); }
  .gloss-bottle .neck { position:absolute; top:24px; left:50%; transform: translateX(-50%); width: 18px; height: 10px; background: #f5e9dc; }
  .gloss-bottle .body { position:absolute; top:34px; left:50%; transform: translateX(-50%); width: 56px; height: 96px; background: linear-gradient(160deg, rgba(255,255,255,.9), #f0b8c2 50%, #d97189); border-radius: 24px 24px 28px 28px; box-shadow: inset -8px 0 12px rgba(217,113,137,.4), inset 8px -8px 14px rgba(255,255,255,.6); }
  .gloss-bottle .label { position:absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: 44px; padding: 6px 2px; background: rgba(255,255,255,.85); border-radius: 4px; text-align:center; font-family: var(--font-serif); font-style: italic; font-size: 10px; color: var(--blush-800); z-index: 2; }
  .price-pill {
    position: absolute; top: 12px; right: 12px;
    font-family: var(--font-serif); font-style: italic; font-size: 16px;
    background: rgba(255,255,255,.8); backdrop-filter: blur(8px);
    color: var(--blush-900); padding: 5px 12px; border-radius: 999px;
    box-shadow: var(--shadow-2);
  }
  .body-row { position: relative; z-index: 2; padding-top: 14px; }
  .ptitle { font-family: var(--font-serif); font-size: 20px; color: var(--ink); margin: 0; }
  .pblurb { font-family: var(--font-serif); font-style: italic; font-size: 14px; color: var(--blush-700); margin: 2px 0 0; }
  .pmeta { font-family: var(--font-sans); font-size: 12px; color: var(--fg-3); margin-top: 6px; }
  .add { margin-top: 12px; display:flex; align-items:center; justify-content:space-between; }
  .add .pillbtn { font-family: var(--font-sans); font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; padding: 8px 14px; border-radius: 999px; background: var(--ink); color: var(--cream); }
  .stars { color: var(--blush-700); font-size: 11px; letter-spacing: .15em; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="product">
      <div class="photo">
        <div class="sheen"></div>
        <div class="gloss-bottle"><div class="cap"></div><div class="neck"></div><div class="body"></div><div class="label">Glass</div></div>
        <span class="price-pill">₦9,500</span>
      </div>
      <div class="body-row">
        <h3 class="ptitle">Glass Lip Gloss</h3>
        <p class="pblurb">Mirror-shine, zero tack.</p>
        <div class="pmeta">8ml · Vanilla kiss</div>
        <div class="add">
          <span class="stars">★ ★ ★ ★ ★ · 312</span>
          <span class="pillbtn">Add to bag</span>
        </div>
      </div>
    </div>
    <div class="product">
      <div class="photo" style="background: var(--grad-gloss);">
        <div class="sheen"></div>
        <div class="gloss-bottle" style="transform: rotate(-6deg);">
          <div class="cap" style="background: linear-gradient(180deg, #b94a68, #5a1a2e);"></div>
          <div class="neck" style="background:#f0b8c2;"></div>
          <div class="body" style="background: linear-gradient(160deg, rgba(255,255,255,.9), #d97189 50%, #8c2d4a);"></div>
          <div class="label" style="color: var(--blush-900);">Petal</div>
        </div>
        <span class="price-pill">₦12,000</span>
      </div>
      <div class="body-row">
        <h3 class="ptitle">Petal Lip Oil</h3>
        <p class="pblurb">Dewy nourishment in a drop.</p>
        <div class="pmeta">6ml · Jojoba + rosehip</div>
        <div class="add">
          <span class="stars">★ ★ ★ ★ ★ · 184</span>
          <span class="pillbtn">Add to bag</span>
        </div>
      </div>
    </div>
  </div>
  <div class="row" style="justify-content:space-between; margin-top: 14px;">
    <span class="label">Product card — gloss-overlay + frosted price-pill</span>
    <span class="mono">--r-xl · --shadow-2 · ::after sheen</span>
  </div>
</div>
</body></html>
