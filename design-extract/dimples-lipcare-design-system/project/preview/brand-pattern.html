<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .stage {
    background: var(--bg-1);
    background-image: url(../assets/pattern-petals.svg);
    background-repeat: repeat;
    background-size: 96px 96px;
    border-radius: var(--r-lg);
    padding: 32px 28px;
    box-shadow: var(--shadow-1);
    text-align: center;
  }
  .stage .e { font-family: var(--font-sans); font-weight: 500; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--blush-700); }
  .stage .h { font-family: var(--font-serif); font-style: italic; font-size: 32px; color: var(--ink); margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="stage">
    <div class="e">Our Products</div>
    <div class="h">A daily lip ritual.</div>
  </div>
  <div class="row" style="justify-content:space-between; margin-top: 14px;">
    <span class="label">Petal pattern · behind section eyebrows only</span>
    <span class="mono">pattern-petals.svg · 8% opacity · 96px tile</span>
  </div>
</div>
</body></html>
