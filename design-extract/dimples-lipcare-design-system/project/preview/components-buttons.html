<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .btn {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 14px;
    letter-spacing: .08em;
    border-radius: var(--r-pill);
    border: 0;
    cursor: pointer;
    padding: 14px 28px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: transform var(--t-fast) var(--ease-soft), box-shadow var(--t-med) var(--ease-soft);
  }
  .btn--primary {
    background: var(--grad-deep);
    color: #fff8f4;
    box-shadow: var(--shadow-2);
  }
  .btn--primary:hover { box-shadow: var(--shadow-3); }
  .btn--secondary {
    background: var(--blush-200);
    color: var(--blush-900);
    box-shadow: var(--shadow-inset-gloss);
  }
  .btn--ghost {
    background: transparent;
    color: var(--blush-700);
    border: 1px solid var(--blush-300);
  }
  .btn--small { padding: 8px 18px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .btn--icon { padding: 14px; border-radius: 999px; background: var(--pearl); box-shadow: var(--shadow-2); color: var(--blush-700); }
  .arr { width: 14px; height: 14px; display:inline-block; }
</style>
</head>
<body>
<div class="card">
  <div style="display:flex; flex-wrap:wrap; gap:14px; align-items:center;">
    <button class="btn btn--primary">Shop the collection
      <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <button class="btn btn--secondary">Book a training</button>
    <button class="btn btn--ghost">Learn more</button>
    <button class="btn btn--primary btn--small">Add to bag</button>
    <button class="btn btn--icon" aria-label="favorite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.5-9.5-9C.8 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.2 4.5 4.5 8-2.5 4.5-9.5 9-9.5 9z"/></svg>
    </button>
  </div>
  <div class="row" style="justify-content:space-between; margin-top: 16px;">
    <span class="label">Buttons · pill, primary uses deep gradient</span>
    <span class="mono">--r-pill · --grad-deep · --shadow-2</span>
  </div>
</div>
</body></html>
